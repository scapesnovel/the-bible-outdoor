name: Custom Short Publisher

# Fires when the owner's phone app commits a change to the custom queue.
# Renders the custom Short (voice-over + music + background) and uploads it
# as a scheduled premiere at the owner's chosen time. Also handles
# cancellations (deletes the video from YouTube if already uploaded).

on:
  push:
    branches: [main]
    paths:
      - "data/custom_queue.json"
  workflow_dispatch: {}
  schedule:
    # Daily sweep: rescue queue items stranded by outages (auto-reschedule).
    - cron: "10 8 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: custom-upload
  cancel-in-progress: false

jobs:
  render-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu
          pip install -q edge-tts pillow google-api-python-client google-auth google-auth-httplib2

      - name: Process custom queue (render + schedule / cancel)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          PIN_APP_ID: ${{ secrets.PIN_APP_ID }}
          PIN_APP_SECRET: ${{ secrets.PIN_APP_SECRET }}
          PIN_REFRESH_TOKEN: ${{ secrets.PIN_REFRESH_TOKEN }}
          PIN_BOARD_ID: ${{ secrets.PIN_BOARD_ID }}
        run: python3 pipeline/custom.py

      - name: Commit queue status updates
        if: always()
        run: |
          git config user.name "bible-outdoor-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/custom_queue.json
          git add data/fb_token.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "custom: queue status update [skip ci]"
          git push origin main || (git pull --rebase origin main && git push origin main)

      - name: Keep artifacts 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: custom-${{ github.run_number }}
          path: |
            output/custom/*.mp4
            output/custom/*.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Alert owner on failure (opens a GitHub issue -> you get an email)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🚨 Custom Short Publisher failed — $(date -u +%Y-%m-%d)"
          BODY="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Most common cause: YouTube refresh token expired/revoked.
          Fix: publish the OAuth app (console.cloud.google.com -> OAuth consent screen -> PUBLISH APP), then regenerate the token with pipeline/get_refresh_token.py and update the YT_REFRESH_TOKEN secret.

          The pipeline auto-retries on its next cron. Custom Shorts whose time passed are auto-rescheduled."
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || echo "")
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY" || true
          else
            gh issue comment "$EXISTING" --body "Failed again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          fi
