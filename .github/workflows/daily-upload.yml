name: Daily Video Factory

on:
  schedule:
    # 07:40 UTC daily: renders ~30 min, then videos are scheduled premieres —
    # long-form goes live 10:45 UTC (6:45am US East morning-devotional prime slot),
    # Short goes live 16:00 UTC (noon US East / evening EU scroll time).
    - cron: "40 7 * * *"
    # Safety nets: retries through the day (idempotent no-op if already published).
    - cron: "40 9 * * *"
    - cron: "40 12 * * *"
    - cron: "40 15 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Force a specific day number (1-31), empty = auto next unpublished slot"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-upload
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu
          pip install -q edge-tts pillow google-api-python-client google-auth google-auth-httplib2

      - name: Build and upload today's videos (scheduled premieres)
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          PIN_APP_ID: ${{ secrets.PIN_APP_ID }}
          PIN_APP_SECRET: ${{ secrets.PIN_APP_SECRET }}
          PIN_REFRESH_TOKEN: ${{ secrets.PIN_REFRESH_TOKEN }}
          PIN_BOARD_ID: ${{ secrets.PIN_BOARD_ID }}
        run: |
          DAY="${{ github.event.inputs.day }}"
          python3 pipeline/daily.py "${DAY:--}"

      - name: Commit publish state + verse ledger (no-repeat memory)
        if: always()
        run: |
          git config user.name "bible-outdoor-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/state.json data/used_verses.json
          git add data/fb_token.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state: record published episode + used verses [skip ci]"
          git push origin main || (git pull --rebase origin main && git push origin main)

      - name: Keep artifacts 3 days for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_number }}
          path: |
            output/**/*.mp4
            output/**/*.jpg
            output/**/*.json
          retention-days: 3
          if-no-files-found: ignore

      - name: Alert owner on failure (opens a GitHub issue -> you get an email)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🚨 Daily Video Factory failed — $(date -u +%Y-%m-%d)"
          BODY="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Most common cause: YouTube refresh token expired/revoked.
          Fix: publish the OAuth app (console.cloud.google.com -> OAuth consent screen -> PUBLISH APP), then regenerate the token with pipeline/get_refresh_token.py and update the YT_REFRESH_TOKEN secret.

          The pipeline auto-retries on its next cron. Custom Shorts whose time passed are auto-rescheduled."
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || echo "")
          if [ -z "$EXISTING" ]; then
            gh issue create --title "$TITLE" --body "$BODY" || true
          else
            gh issue comment "$EXISTING" --body "Failed again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" || true
          fi
