name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android-app/app/build/outputs/apk/debug/app-debug.apk \
             out/OwnerStudio.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OwnerStudio-APK
          path: out/OwnerStudio.apk
          retention-days: 30

      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Owner Studio APK (latest)"
          body: "Download OwnerStudio.apk below, open it on your phone, and install."
          files: out/OwnerStudio.apk
